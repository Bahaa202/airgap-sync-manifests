apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: airgap-sync
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/bahaa202/airgap-sync-backend:latest
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
          envFrom:
            - secretRef: {name: airgap-sync-secrets}
