apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: airgap-sync
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/bahaa202/airgap-sync-backend:latest
          command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          envFrom:
            - secretRef: {name: airgap-sync-secrets}
          volumeMounts:
            - name: pull-secret
              mountPath: /root/.docker
              readOnly: true
            - name: mirror-workdir
              mountPath: /tmp/mirror-jobs
      volumes:
        - name: pull-secret
          secret:
            secretName: oc-mirror-pull-secret
        - name: mirror-workdir
          emptyDir:
            sizeLimit: 60Gi
