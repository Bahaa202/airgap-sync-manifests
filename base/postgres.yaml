apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: airgap-sync
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: "airgap_user"}
            - {name: POSTGRES_PASSWORD, value: "CHANGE_ME"}
            - {name: POSTGRES_DB, value: "airgap_saas"}
          ports:
            - containerPort: 5432
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: airgap-sync
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
